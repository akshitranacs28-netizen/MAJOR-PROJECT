<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080908">
  <title>Log in | Home Energy</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#080908;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px}.back{position:absolute;left:25px;top:22px;color:#fff;text-decoration:none;font-size:12px;opacity:.78}.back:hover{opacity:1}.panel{width:min(100%,440px);text-align:center}.mark{margin:0 auto 30px;width:68px;height:68px;border:1px solid #ffffff55;border-radius:45% 55% 60% 40% / 40% 42% 58% 60%;display:grid;place-items:center;font-size:27px;font-weight:700}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.72}.panel h1{font-size:34px;letter-spacing:-.04em;margin:9px 0}.panel>p{font-size:13px;line-height:1.65;opacity:.75;margin:0}.form{margin-top:27px;text-align:left}.form label{display:block;font-size:11px;margin-bottom:8px}.form input{width:100%;height:58px;border:1px solid #ffffff32;border-radius:13px;background:#1c1c1c;padding:0 16px;color:#fff;font-size:15px;outline:0}.form input:focus{border-color:#fff;box-shadow:0 0 0 3px #ffffff1a}.form button{width:100%;height:58px;margin-top:12px;border:1px solid #fff;border-radius:13px;background:#fff;color:#080908;font-size:15px;font-weight:700;cursor:pointer}.form button:hover{background:#e6e6e6}.divider{display:flex;align-items:center;gap:13px;margin:22px 0;color:#fff;opacity:.6;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#ffffff35;flex:1}.note{margin-top:20px!important;font-size:10px!important;opacity:.55!important}.error{min-height:18px;margin-top:10px;font-size:11px;color:#fff}.backline{display:inline-block;margin-top:22px;color:#fff;font-size:11px;opacity:.75} @media(max-width:480px){.panel h1{font-size:30px}.back{left:16px;top:17px}}
  </style>
</head>
<body>
  <a class="back" href="index.html">← Back</a>
  <main class="panel">
    <div class="mark" aria-hidden="true">⌁</div>
    <div class="eyebrow">Home Energy · MyEMS</div>
    <h1>Log in or sign up</h1>
    <p>Continue to your home energy and carbon dashboard.</p>
    <form class="form" id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Continue</button>
      <div class="error" id="loginError" role="status"></div>
    </form>
    <div class="divider">or</div>
    <p class="note">Demo sign-in: entering an email opens this browser’s sample dashboard. It does not create an account or verify a password. Live Google or Apple authentication is not configured.</p>
    <a class="backline" href="index.html">Return to home</a>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit',function(event){event.preventDefault();var email=document.getElementById('email').value.trim();if(!email)return;try{localStorage.setItem('homeEnergySignedIn','true');localStorage.setItem('homeEnergyEmail',email);window.location.replace('Home-Energy-Carbon-Manager.html')}catch(error){document.getElementById('loginError').textContent='Your browser blocked local storage. Enable it to continue to the demo.'}});
  </script>
</body>
</html>
